<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Reward Overlay</title>

  <!-- ANIME.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <!-- CONFETTI -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');

    :root {
      --fade-in: 500ms;
      --fade-out: 600ms;
      --accent: #00ffcc;
      --accent2: #7b61ff;
      --glass: rgba(10, 10, 18, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
    }

    /* ═══ STAGE ═══ */
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #stage.visible {
      pointer-events: auto;
    }

    /* Animated backdrop */
    #backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.08) 0%, rgba(0, 0, 0, 0.6) 70%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #stage.visible #backdrop {
      opacity: 1;
    }

    /* ═══ IMAGE FRAME ═══ */
    #frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6) rotate(-3deg);
    }

    /* Animated gradient border */
    #frame::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: conic-gradient(from var(--rotation, 0deg),
          var(--accent),
          var(--accent2),
          #ff6b9d,
          var(--accent),
          var(--accent2),
          var(--accent));
      z-index: -1;
      animation: rotateBorder 4s linear infinite;
      opacity: 0.9;
      filter: blur(1px);
    }

    @property --rotation {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateBorder {
      to {
        --rotation: 360deg;
      }
    }

    /* Glow behind frame */
    #frame::after {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 30px;
      background: conic-gradient(from var(--rotation, 0deg),
          var(--accent),
          var(--accent2),
          transparent,
          var(--accent));
      z-index: -2;
      animation: rotateBorder 4s linear infinite;
      filter: blur(40px);
      opacity: 0.4;
    }

    #img {
      max-width: 78vw;
      max-height: 76vh;
      object-fit: contain;
      border-radius: 16px;
      position: relative;
      z-index: 1;
    }

    /* Grain overlay on image */
    #frame .grain {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ═══ CAPTION ═══ */
    #caption {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      padding: 14px 32px;
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.6),
        0 0 60px -15px var(--accent),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      opacity: 0;
      z-index: 100;
    }

    #caption span {
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      text-transform: uppercase;
      animation: shimmerText 3s linear infinite;
    }

    @keyframes shimmerText {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 200% 50%;
      }
    }

    /* ═══ SPARKLES ═══ */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes sparkleFloat {
      0% {
        transform: translateY(0) scale(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
        transform: translateY(-20px) scale(1) rotate(90deg);
      }

      100% {
        transform: translateY(-200px) scale(0) rotate(360deg);
        opacity: 0;
      }
    }

    /* ═══ CONTROLS ═══ */
    .hidden {
      display: none !important;
    }

    .test-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Outfit', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .test-btn:hover {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <button class="test-btn" onclick="testShow()">🎨 TEST</button>

  <div id="stage" class="hidden">
    <div id="backdrop"></div>
    <div id="frame">
      <img id="img" alt="" />
      <div class="grain"></div>
    </div>
    <div id="caption" class="hidden"></div>
  </div>

  <!-- SPARKLE CONTAINER -->
  <div id="sparkles" style="position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;"></div>

  <script>
    const WS_URL = "ws://127.0.0.1:7474/";
    const ACTION = "image_reward";
    const SHOW_CAPTION = true;

    const CAPTION_TEMPLATES = [
      "Нейрослоп от <span>{user}</span>",
      "Ну и что ты выс***, <span>{user}</span>?",
      "Шедевр от <span>{user}</span>",
      "Галлюцинации <span>{user}</span> в цвете",
      "Сгенерировано по заказу <span>{user}</span>",
      "Творческий поток <span>{user}</span>",
      "Нейронные связи <span>{user}</span> перегрелись",
      "Видение <span>{user}</span>",
      "Промпт: <span>{user}</span>. Результат: ШОК.",
      "Это точно то, что ты хотел, <span>{user}</span>?",
      "Холст, масло, <span>{user}</span>"
    ];

    const stage = document.getElementById("stage");
    const frame = document.getElementById("frame");
    const img = document.getElementById("img");
    const caption = document.getElementById("caption");
    const sparklesContainer = document.getElementById("sparkles");

    function log(m) {
      console.log("[Overlay]", m);
    }

    function testShow() {
      showOverlay({
        user: "kiwunakas",
        image: "../Assets/intro_Skuf.png",
        duration: 8000
      });
    }

    let ws;
    let hideTimer;

    // ═══ SPARKLE SYSTEM ═══
    function createSparkles(count = 25) {
      const emojis = ['✨', '⭐', '💫', '🌟', '✴️'];
      for (let i = 0; i < count; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle';
        sp.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        sp.style.cssText = `
          position:absolute;
          left:${10 + Math.random() * 80}%;
          bottom:${Math.random() * 40}%;
          font-size:${14 + Math.random() * 22}px;
          animation: sparkleFloat ${2.5 + Math.random() * 2}s ease-out ${Math.random() * 1.5}s forwards;
        `;
        sparklesContainer.appendChild(sp);
      }
      // Clean up after animations
      setTimeout(() => {
        sparklesContainer.innerHTML = '';
      }, 5000);
    }

    // ═══ SHOW OVERLAY ═══
    function showOverlay(data) {
      if (!data.image) {
        log("Error: No image in data");
        return;
      }

      clearTimeout(hideTimer);

      // Set image
      img.src = data.image;

      // Caption
      if (SHOW_CAPTION) {
        const userName = data.user || data.userName || data.username || "Аноним";
        const template = CAPTION_TEMPLATES[Math.floor(Math.random() * CAPTION_TEMPLATES.length)];
        caption.innerHTML = template.replace("{user}", userName);
        caption.classList.remove("hidden");
      } else {
        caption.classList.add("hidden");
      }

      // Show stage
      stage.classList.remove("hidden");
      void stage.offsetWidth;

      // ANIME.JS entrance sequence
      anime({
        targets: stage,
        opacity: [0, 1],
        duration: 500,
        easing: 'easeOutQuad',
        begin: () => stage.classList.add('visible')
      });

      // Image frame entrance — scale + rotation + spring
      anime({
        targets: frame,
        opacity: [0, 1],
        scale: [0.5, 1.04, 1],
        rotate: [-5, 2, 0],
        duration: 1200,
        delay: 150,
        easing: 'easeOutElastic(1, .6)'
      });

      // Caption slide up
      if (SHOW_CAPTION) {
        anime({
          targets: caption,
          opacity: [0, 1],
          translateY: [30, 0],
          translateX: ['-50%', '-50%'],
          scale: [0.9, 1],
          duration: 700,
          delay: 600,
          easing: 'easeOutBack'
        });
      }

      // Sparkles + confetti
      setTimeout(() => createSparkles(), 300);
      setTimeout(() => {
        confetti({
          particleCount: 80,
          spread: 100,
          origin: { y: 0.5 },
          colors: ['#00ffcc', '#7b61ff', '#ff6b9d', '#fff']
        });
      }, 400);

      hideTimer = setTimeout(hideOverlay, data.duration || 10000);
    }

    // ═══ HIDE OVERLAY ═══
    function hideOverlay() {
      // Cinematic exit — blur + scale down + fade
      anime({
        targets: frame,
        opacity: [1, 0],
        scale: [1, 0.85],
        rotate: [0, 3],
        filter: ['blur(0px)', 'blur(12px)'],
        duration: 500,
        easing: 'easeInQuad'
      });

      anime({
        targets: caption,
        opacity: [1, 0],
        translateY: [0, 20],
        duration: 400,
        easing: 'easeInQuad'
      });

      anime({
        targets: stage,
        opacity: [1, 0],
        duration: 600,
        delay: 200,
        easing: 'easeInQuad',
        complete: () => {
          stage.classList.remove("visible");
          stage.classList.add("hidden");
          frame.style.filter = 'none';
          sparklesContainer.innerHTML = '';
        }
      });
    }

    // ═══ WEBSOCKET ═══
    function connect() {
      log("Connecting to " + WS_URL);
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        log("Connected");
        ws.send(JSON.stringify({
          request: "Subscribe",
          id: "IMG_OVERLAY_SUB",
          events: {
            General: ["Custom"],
            Raw: ["Action", "SubAction"]
          }
        }));
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (!msg) return;

        let data = (msg.action === ACTION) ? msg :
          (msg.data && msg.data.action === ACTION ? msg.data :
            (msg.event && msg.event.data && msg.event.data.action === ACTION ? msg.event.data : null));

        if (data) {
          log("Signal Received: " + data.action);
          showOverlay(data);
        }
      };

      ws.onclose = () => {
        log("Disconnected");
        setTimeout(connect, 2000);
      };
      ws.onerror = (e) => {
        ws.close();
      };
    }

    connect();
  </script>
</body>

</html>
