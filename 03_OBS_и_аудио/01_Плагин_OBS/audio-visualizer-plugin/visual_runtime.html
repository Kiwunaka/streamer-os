<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer OS Runtime</title>
    <style>
        :root {
            --bg: rgba(8, 12, 20, 0.78);
            --panel: rgba(19, 26, 40, 0.88);
            --line: rgba(255, 255, 255, 0.16);
            --text: #f6f8ff;
            --muted: #b1bdd6;
            --accent: #7cd7ff;
            --accent-2: #ffa968;
            --shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
            --radius: 32px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Segoe UI", Inter, sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .runtime-shell {
            position: relative;
            width: min(92vw, 1120px);
            min-height: 240px;
            padding: 30px 34px;
            border-radius: var(--radius);
            background:
                radial-gradient(circle at top left, rgba(124, 215, 255, 0.16), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 169, 104, 0.14), transparent 28%),
                var(--bg);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(28px);
            opacity: 0;
            transform: translateY(28px) scale(0.96);
            transition: opacity 240ms ease, transform 240ms ease, background 240ms ease, border-color 240ms ease;
            overflow: hidden;
        }

        .runtime-shell.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .runtime-shell::before,
        .runtime-shell::after {
            content: "";
            position: absolute;
            inset: auto;
            pointer-events: none;
            opacity: 0.75;
        }

        .runtime-shell::before {
            top: -40px;
            right: -20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 215, 255, 0.28), transparent 68%);
        }

        .runtime-shell::after {
            bottom: -55px;
            left: -20px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 169, 104, 0.24), transparent 68%);
        }

        .status-row {
            position: absolute;
            right: 24px;
            top: 22px;
            display: flex;
            gap: 8px;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
            z-index: 2;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 18px rgba(124, 215, 255, 0.8);
        }

        .runtime-kicker {
            position: relative;
            z-index: 2;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .runtime-title {
            position: relative;
            z-index: 2;
            font-size: clamp(34px, 4vw, 72px);
            line-height: 0.95;
            font-weight: 800;
            margin: 0 0 14px;
            max-width: 900px;
        }

        .runtime-subtitle {
            position: relative;
            z-index: 2;
            font-size: clamp(16px, 1.5vw, 24px);
            color: var(--muted);
            margin: 0 0 18px;
            max-width: 920px;
        }

        .runtime-body {
            position: relative;
            z-index: 2;
            margin-top: 16px;
            max-width: 920px;
            font-size: 18px;
            line-height: 1.45;
            color: var(--text);
            white-space: pre-wrap;
        }

        .runtime-meta {
            position: relative;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .runtime-chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 14px;
        }

        .stats-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            padding: 14px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.09);
            font-size: 15px;
            color: var(--text);
        }

        .special-stage {
            position: relative;
            z-index: 2;
            margin-top: 18px;
            display: none;
        }

        .special-stage.active {
            display: block;
        }

        .fortune-card,
        .loot-banner,
        .duel-board {
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .fortune-card {
            padding: 26px 28px;
            background:
                linear-gradient(140deg, rgba(77, 31, 111, 0.92), rgba(19, 16, 49, 0.92)),
                radial-gradient(circle at top right, rgba(255, 236, 170, 0.24), transparent 30%);
            box-shadow: 0 18px 50px rgba(44, 13, 78, 0.45);
        }

        .fortune-label {
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #f7df95;
            margin-bottom: 10px;
        }

        .fortune-quote {
            font-size: clamp(24px, 3vw, 38px);
            line-height: 1.1;
            font-weight: 800;
            max-width: 820px;
        }

        .fortune-foot {
            margin-top: 14px;
            color: rgba(245, 237, 255, 0.78);
            font-size: 15px;
        }

        .loot-banner {
            padding: 22px 24px;
            background:
                linear-gradient(135deg, rgba(13, 17, 33, 0.95), rgba(37, 20, 64, 0.95));
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.42);
        }

        .loot-banner[data-rarity="common"] { border-color: rgba(187, 197, 216, 0.38); }
        .loot-banner[data-rarity="uncommon"] { border-color: rgba(122, 230, 166, 0.45); }
        .loot-banner[data-rarity="rare"] { border-color: rgba(110, 188, 255, 0.52); }
        .loot-banner[data-rarity="epic"] { border-color: rgba(210, 110, 255, 0.54); }
        .loot-banner[data-rarity="legendary"] { border-color: rgba(255, 199, 92, 0.58); }

        .loot-topline {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
        }

        .loot-rarity {
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #ffd37a;
        }

        .loot-name {
            margin-top: 8px;
            font-size: clamp(28px, 3vw, 44px);
            line-height: 1;
            font-weight: 900;
        }

        .loot-owner {
            margin-top: 10px;
            font-size: 17px;
            color: rgba(244, 246, 255, 0.8);
        }

        .duel-board {
            padding: 26px 24px 24px;
            background:
                linear-gradient(180deg, rgba(14, 18, 31, 0.96), rgba(8, 10, 20, 0.96));
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.05), 0 18px 48px rgba(0, 0, 0, 0.46);
        }

        .duel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        .duel-mode {
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #85ffd2;
        }

        .duel-winner {
            font-size: 14px;
            color: #ffd57b;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .duel-arena {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 18px;
        }

        .fighter-card {
            padding: 18px 16px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 2px solid rgba(255, 255, 255, 0.09);
            font-family: "Courier New", monospace;
            text-transform: uppercase;
        }

        .fighter-card[data-winner="true"] {
            border-color: rgba(255, 214, 118, 0.7);
            box-shadow: 0 0 24px rgba(255, 214, 118, 0.18);
        }

        .fighter-name {
            font-size: clamp(24px, 2.6vw, 36px);
            line-height: 1;
            font-weight: 700;
        }

        .fighter-item {
            margin-top: 10px;
            color: rgba(217, 226, 255, 0.76);
            font-size: 13px;
        }

        .fighter-power {
            margin-top: 14px;
            font-size: clamp(30px, 3vw, 42px);
            color: #7cd7ff;
            font-weight: 900;
        }

        .versus {
            width: 120px;
            height: 120px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Courier New", monospace;
            font-size: 44px;
            font-weight: 900;
            color: #ffcf6f;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.08) 0px,
                    rgba(255, 255, 255, 0.08) 4px,
                    transparent 4px,
                    transparent 8px
                ),
                linear-gradient(135deg, rgba(20, 30, 55, 0.95), rgba(36, 10, 24, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.04);
        }

        .runtime-shell.theme-fortune {
            background:
                radial-gradient(circle at top left, rgba(222, 178, 255, 0.22), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 218, 147, 0.18), transparent 28%),
                rgba(14, 10, 30, 0.88);
            border-color: rgba(232, 194, 255, 0.32);
        }

        .runtime-shell.theme-fortune .runtime-kicker,
        .runtime-shell.theme-fortune .status-dot {
            color: #e8c5ff;
            background: #e8c5ff;
        }

        .runtime-shell.theme-loot {
            background:
                radial-gradient(circle at top left, rgba(108, 187, 255, 0.2), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 210, 126, 0.22), transparent 28%),
                rgba(8, 11, 24, 0.88);
        }

        .runtime-shell.theme-duel {
            background:
                linear-gradient(180deg, rgba(10, 14, 20, 0.92), rgba(13, 10, 28, 0.92));
            border-color: rgba(116, 239, 208, 0.34);
        }
        .runtime-media { display: block; width: 100%; max-height: 42vh; object-fit: contain; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="runtime" class="runtime-shell">
        <div class="status-row">
            <span class="status-dot"></span>
            <span id="meta">idle</span>
        </div>
        <div id="kicker" class="runtime-kicker">Streamer OS Runtime</div>
        <h1 id="title" class="runtime-title"></h1>
        <p id="subtitle" class="runtime-subtitle"></p>
        <div id="stage" class="special-stage"></div>
        <div id="body" class="runtime-body"></div>
        <div id="chips" class="runtime-meta"></div>
        <div id="stats" class="stats-grid"></div>
    </div>

    <script>
        const runtime = document.getElementById('runtime');
        const kicker = document.getElementById('kicker');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const stage = document.getElementById('stage');
        const body = document.getElementById('body');
        const chips = document.getElementById('chips');
        const stats = document.getElementById('stats');
        const meta = document.getElementById('meta');

        let currentId = '';
        let activeAudio = null;

        function stopMedia() {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.removeAttribute('src');
                activeAudio.load();
                activeAudio = null;
            }
        }

        function renderMedia(payload, type) {
            renderGeneric(payload, type);
            title.textContent = payload.persona || payload.title || 'Streamer OS';
            subtitle.textContent = payload.donor ? `${payload.donor} · ${payload.amount || ''}` : (payload.user || payload.notification || '');
            body.textContent = payload.message || payload.reactionText || payload.prompt || '';
            const intro = payload.intro || {};
            const image = payload.image || (intro.image ? `assets/${encodeURIComponent(intro.image)}` : '');
            const audio = payload.audio || (intro.audio ? `assets/${encodeURIComponent(intro.audio)}` : '');
            if (image) {
                const node = document.createElement('img');
                node.className = 'runtime-media';
                node.alt = payload.prompt || payload.persona || 'Изображение события';
                node.src = image;
                node.onerror = () => node.remove();
                stage.appendChild(node);
                stage.classList.add('active');
            }
            if (audio) {
                activeAudio = new Audio(audio);
                activeAudio.play().catch(() => { meta.textContent = 'Не удалось воспроизвести звук'; });
            }
        }

        function clearNodes(node) {
            while (node.firstChild) node.removeChild(node.firstChild);
        }

        function addChip(text) {
            const el = document.createElement('div');
            el.className = 'runtime-chip';
            el.textContent = text;
            chips.appendChild(el);
        }

        function setTheme(theme) {
            runtime.classList.remove('theme-fortune', 'theme-loot', 'theme-duel');
            if (theme) runtime.classList.add(theme);
        }

        function createStatCard(text) {
            const card = document.createElement('div');
            card.className = 'stat-card';
            card.textContent = text;
            return card;
        }

        function renderStats(payload) {
            clearNodes(stats);
            if (Array.isArray(payload.stats)) {
                payload.stats.forEach((line) => stats.appendChild(createStatCard(line)));
            }
        }

        function renderGeneric(payload, type) {
            setTheme('');
            stage.classList.remove('active');
            stage.innerHTML = '';

            title.textContent = payload.title || payload.persona || payload.message || 'Runtime event';
            subtitle.textContent = payload.subtitle || payload.notification || payload.level || '';
            body.textContent = payload.body || payload.message || '';

            if (payload.voiceProfile) addChip(`Voice: ${payload.voiceProfile}`);
            if (payload.themePreset) addChip(`Theme: ${payload.themePreset}`);
            if (payload.imageStyleProfile) addChip(`Style: ${payload.imageStyleProfile}`);
            if (payload.level) addChip(`Level: ${payload.level}`);

            renderStats(payload);
            kicker.textContent = type.replace('.v1', '').replace(/\./g, ' / ');
        }

        function renderFortune(payload) {
            setTheme('theme-fortune');
            stage.classList.add('active');
            title.textContent = payload.title || 'Fortune Oracle';
            subtitle.textContent = payload.subtitle || '';
            body.textContent = '';
            kicker.textContent = 'fortune / oracle';

            const card = document.createElement('div');
            card.className = 'fortune-card';

            const label = document.createElement('div');
            label.className = 'fortune-label';
            label.textContent = (payload.mode || 'oracle').toUpperCase();

            const quote = document.createElement('div');
            quote.className = 'fortune-quote';
            quote.textContent = payload.body || payload.message || '';

            const foot = document.createElement('div');
            foot.className = 'fortune-foot';
            foot.textContent =
                payload.user ? `For ${payload.user}` :
                payload.owner ? `For ${payload.owner}` :
                (payload.topic || 'Mystic stream reading');

            card.appendChild(label);
            card.appendChild(quote);
            card.appendChild(foot);
            stage.innerHTML = '';
            stage.appendChild(card);
            renderStats(payload);
        }

        function renderLoot(payload) {
            setTheme('theme-loot');
            stage.classList.add('active');
            title.textContent = payload.itemName || payload.title || 'Loot drop';
            subtitle.textContent = payload.subtitle || '';
            body.textContent = payload.body || '';
            kicker.textContent = 'loot / drop';

            const banner = document.createElement('div');
            banner.className = 'loot-banner';
            banner.dataset.rarity = payload.rarity || 'common';

            const topLine = document.createElement('div');
            topLine.className = 'loot-topline';

            const rarity = document.createElement('div');
            rarity.className = 'loot-rarity';
            rarity.textContent = (payload.rarity || 'common').toUpperCase();

            const bonus = document.createElement('div');
            bonus.className = 'loot-rarity';
            bonus.textContent = payload.bonus ? `BONUS +${payload.bonus}` : 'NEW DROP';

            const name = document.createElement('div');
            name.className = 'loot-name';
            name.textContent = payload.itemName || payload.title || 'Unknown item';

            const owner = document.createElement('div');
            owner.className = 'loot-owner';
            const ownerName = payload.owner || payload.user || '';
            owner.textContent = ownerName ? `${ownerName} claimed the item` : (payload.subtitle || '');

            topLine.appendChild(rarity);
            topLine.appendChild(bonus);
            banner.appendChild(topLine);
            banner.appendChild(name);
            banner.appendChild(owner);
            stage.innerHTML = '';
            stage.appendChild(banner);
            renderStats(payload);
        }

        function renderDuel(payload) {
            setTheme('theme-duel');
            stage.classList.add('active');
            title.textContent = payload.title || 'Duel';
            subtitle.textContent = payload.subtitle || '';
            body.textContent = '';
            kicker.textContent = 'duel / result';

            const fighters = Array.isArray(payload.fighters) ? payload.fighters : [];
            const left = fighters[0] || { name: 'fighter-a', power: 0, item: 'none', rarity: 'common' };
            const right = fighters[1] || { name: 'fighter-b', power: 0, item: 'none', rarity: 'common' };

            const board = document.createElement('div');
            board.className = 'duel-board';

            const header = document.createElement('div');
            header.className = 'duel-header';

            const mode = document.createElement('div');
            mode.className = 'duel-mode';
            mode.textContent = payload.mode || 'ARCADE TEXT DUEL';

            const winner = document.createElement('div');
            winner.className = 'duel-winner';
            winner.textContent = payload.winner ? `Winner: ${payload.winner}` : 'Winner: pending';

            const arena = document.createElement('div');
            arena.className = 'duel-arena';

            const leftCard = renderFighter(left, payload.winner);
            const rightCard = renderFighter(right, payload.winner);

            const versus = document.createElement('div');
            versus.className = 'versus';
            versus.textContent = 'VS';

            header.appendChild(mode);
            header.appendChild(winner);
            arena.appendChild(leftCard);
            arena.appendChild(versus);
            arena.appendChild(rightCard);
            board.appendChild(header);
            board.appendChild(arena);
            stage.innerHTML = '';
            stage.appendChild(board);
            body.textContent = payload.body || '';
            renderStats(payload);
        }

        function renderFighter(fighter, winnerName) {
            const card = document.createElement('div');
            card.className = 'fighter-card';
            card.dataset.winner = String((fighter.name || '').toLowerCase() === String(winnerName || '').toLowerCase());

            const name = document.createElement('div');
            name.className = 'fighter-name';
            name.textContent = fighter.name || 'FIGHTER';

            const item = document.createElement('div');
            item.className = 'fighter-item';
            item.textContent = `${(fighter.rarity || 'common').toUpperCase()} | ${fighter.item || 'none'}`;

            const power = document.createElement('div');
            power.className = 'fighter-power';
            power.textContent = String(fighter.power || 0);

            card.appendChild(name);
            card.appendChild(item);
            card.appendChild(power);
            return card;
        }

        function renderEvent(event) {
            stopMedia();
            if (!event) {
                currentId = '';
                runtime.classList.remove('visible');
                meta.textContent = 'idle';
                return;
            }

            const payload = event.payload || {};
            const type = event.type || 'overlay.show.v1';
            currentId = event.eventId || '';
            clearNodes(chips);
            clearNodes(stats);
            stage.classList.remove('active');
            stage.innerHTML = '';
            meta.textContent = `${type} | p${event.priority ?? 50}`;

            if (type === 'overlay.hide.v1') {
                renderEvent(null);
                return;
            } else if (type === 'donation.scene.v1' || type === 'image.reward.v1' || type === 'persona.switch.v1') {
                renderMedia(payload, type);
            } else if (payload.template === 'loading') {
                renderGeneric({ title: payload.persona, subtitle: payload.donor, message: 'Готовлю ответ…' }, type);
            } else if (type === 'fortune.oracle.v1') {
                renderFortune(payload);
            } else if (type === 'loot.drop.v1') {
                renderLoot(payload);
            } else if (type === 'duel.result.v1') {
                renderDuel(payload);
            } else {
                renderGeneric(payload, type);
            }

            runtime.classList.add('visible');
        }

        async function poll() {
            try {
                const response = await fetch('http://127.0.0.1:1608/runtime/state', { cache: 'no-store' });
                if (!response.ok) {
                    renderEvent(null);
                    meta.textContent = 'runtime offline';
                    return;
                }

                const data = await response.json();
                const event = data.activeEvent || null;
                if (!event && currentId) {
                    renderEvent(null);
                    return;
                }

                if (event && event.eventId !== currentId) {
                    renderEvent(event);
                }
            } catch (error) {
                renderEvent(null);
                meta.textContent = 'waiting for plugin';
            }
        }

        async function pollLoop() {
            await poll();
            setTimeout(pollLoop, 220);
        }
        pollLoop();
    </script>
</body>
</html>
