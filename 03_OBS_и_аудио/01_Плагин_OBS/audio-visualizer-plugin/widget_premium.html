<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna Premium Widget 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Bricolage+Grotesque:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===========================================
           🔥 PREMIUM MUSIC WIDGET 2026 - TUNA FOR OBS
           Features: Particles, Rotation, Marquee, 
           Reflection, Gradient, Glow
           =========================================== */

        :root {
            --accent-color: #f8b84e;
            --accent-secondary: #6ef2e3;
            --accent-tertiary: #ff6a3d;
            --text-primary: #f5f7fb;
            --text-secondary: rgba(245, 247, 251, 0.68);
            --card-bg: rgba(12, 14, 18, 0.74);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-highlight: rgba(255, 255, 255, 0.16);
            --grid-color: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(0, 0, 0, 0.55);
            --card-radius: 28px;
            --cover-radius: 18px;
            --cover-size: 160px;
            --transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-display: 'Unbounded', 'Segoe UI', sans-serif;
            --font-body: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
            --font-stack: var(--font-body);
        }

        :root[data-theme="ember"] {
            --accent-color: #f8b84e;
            --accent-secondary: #6ef2e3;
            --accent-tertiary: #ff6a3d;
            --card-bg: rgba(12, 14, 18, 0.76);
        }

        :root[data-theme="ice"] {
            --accent-color: #7bd7ff;
            --accent-secondary: #b1f6e3;
            --accent-tertiary: #9aa6ff;
            --card-bg: rgba(8, 14, 24, 0.78);
        }

        :root[data-theme="mono"] {
            --accent-color: #f5f7fb;
            --accent-secondary: #b3bcc9;
            --accent-tertiary: #707987;
            --card-bg: rgba(14, 15, 18, 0.82);
            --text-secondary: rgba(226, 231, 240, 0.55);
        }

        :root[data-theme="signal"] {
            --accent-color: #ffb347;
            --accent-secondary: #7cffd8;
            --accent-tertiary: #ff6bd6;
            --card-bg: rgba(10, 10, 16, 0.78);
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: var(--font-stack);
        }

        /* === MAIN CONTAINER === */
        #widget {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 650px;
            opacity: 0;
            transform: translateY(30px) scale(0.94);
            transition: opacity var(--transition), transform var(--transition);
            will-change: opacity, transform;
        }

        #widget.playing {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* === CARD CONTAINER === */
        .card {
            position: relative;
            border-radius: var(--card-radius);
            border: 1px solid var(--card-border);
            overflow: hidden;
            background:
                radial-gradient(120% 140% at 80% 0%, rgba(248, 184, 78, 0.08) 0%, rgba(0, 0, 0, 0) 60%),
                radial-gradient(140% 180% at 0% 100%, rgba(110, 242, 227, 0.1) 0%, rgba(0, 0, 0, 0) 55%),
                var(--card-bg);
            box-shadow:
                0 18px 40px var(--shadow-color),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(135deg,
                    rgba(255, 255, 255, 0.03) 0px,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 6px);
            opacity: 0.25;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 1;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.08), transparent 45%);
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        /* === ANIMATED GRADIENT BACKGROUND === */
        .bg-layer {
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background-size: cover;
            background-position: center;
            filter: blur(50px);
            opacity: 0.85;
            z-index: 0;
            transition: background-image 1s ease-in-out;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {

            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.03) rotate(1deg);
            }
        }

        /* === PARTICLES CONTAINER === */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatParticle 6s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        @keyframes floatParticle {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120px) translateX(20px);
                opacity: 0;
            }
        }

        /* === GLASS OVERLAY === */
        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.03) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* === CONTENT === */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            padding: 26px 28px;
            gap: 22px;
        }

        #widget[data-preset="stack"] .content {
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        #widget[data-preset="stack"] .visualizer {
            width: 100%;
            height: 70px;
        }

        #widget[data-preset="stack"] .visualizer-bars {
            grid-template-columns: repeat(16, 1fr);
        }

        #widget[data-preset="poster"] .title {
            font-size: 34px;
            letter-spacing: 0.8px;
        }

        #widget[data-preset="poster"] .card {
            background:
                radial-gradient(120% 140% at 70% 0%, rgba(255, 106, 61, 0.15) 0%, rgba(0, 0, 0, 0) 60%),
                radial-gradient(140% 180% at 10% 100%, rgba(110, 242, 227, 0.14) 0%, rgba(0, 0, 0, 0) 55%),
                var(--card-bg);
        }

        #widget[data-preset="orbit"] .cover {
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(110, 242, 227, 0.25), 0 0 0 2px rgba(255, 255, 255, 0.2) inset;
        }

        #widget[data-preset="orbit"] .cover-glow {
            opacity: 0.9;
        }

        #widget:not([data-viz="ring"]) #cover-canvas {
            opacity: 0;
        }

        #widget:not([data-viz="ring"]) .audio-ring {
            opacity: 0 !important;
        }

        /* === COVER WITH ROTATION & REFLECTION === */
        .cover-container {
            position: relative;
            width: var(--cover-size);
            flex-shrink: 0;
        }

        .cover {
            width: var(--cover-size);
            height: var(--cover-size);
            border-radius: 50%;
            /* Round cover */
            background-size: cover;
            background-position: center;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(255, 255, 255, 0.2) inset;
            transition: transform 0.4s ease;
        }

        /* Cover rotation when playing */
        #widget.playing .cover {
            animation: coverSpin 12s linear infinite;
        }

        @keyframes coverSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .cover-reflection {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: var(--cover-size);
            height: 50px;
            background-size: cover;
            background-position: center bottom;
            border-radius: 50%;
            /* Round reflection */
            transform: scaleY(-1);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
            opacity: 0.5;
            filter: blur(2px);
        }

        /* Cover glow */
        .cover-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            transform: translate(-50%, -50%);
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.6);
            opacity: 0.6;
            z-index: -1;
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* === INFO SECTION === */
        .info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Marquee for long titles */
        .title-container {
            overflow: hidden;
            position: relative;
        }

        .title {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            letter-spacing: 0.5px;
            line-height: 1.2;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .title.marquee {
            display: inline-block;
            animation: marquee 10s linear infinite;
            padding-right: 50px;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .artist {
            font-family: var(--font-body);
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }

        /* === PROGRESS BAR === */
        .progress-section {
            margin-top: 16px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0.4),
                    rgba(255, 255, 255, 0.95));
            border-radius: 3px;
            transition: width 0.5s linear;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        /* No shine animation - clean look */
        .progress-fill::before {
            display: none;
        }

        /* === VISUALIZER === */
        .visualizer {
            position: relative;
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }

        #viz-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .visualizer-bars {
            position: absolute;
            inset: 12px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            align-items: end;
        }

        .visualizer-bars .bar {
            height: 12%;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--accent-secondary), var(--accent-color));
            box-shadow: 0 0 14px rgba(110, 242, 227, 0.3);
            transition: height 0.12s ease-out, opacity 0.12s ease-out;
        }

        #widget[data-viz="bars"] .visualizer-bars {
            display: grid;
        }

        #widget[data-viz="bars"] #viz-canvas {
            display: none;
        }

        #widget:not([data-viz="bars"]) .visualizer-bars {
            display: none;
        }

        /* Audio-reactive cover glow rings */
        .cover-wrap {
            position: relative;
        }

        .audio-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: all 0.08s ease-out;
        }

        .audio-ring.bass {
            inset: -10px;
            border: 3px solid var(--accent-color, #ec4899);
            box-shadow: 0 0 25px var(--accent-color, #ec4899);
        }

        .audio-ring.mid {
            inset: -20px;
            border: 2px solid var(--accent-color, #ec4899);
            opacity: 0.7;
            box-shadow: 0 0 18px var(--accent-color, #ec4899);
        }

        .audio-ring.high {
            inset: -30px;
            border: 1px solid var(--accent-color, #ec4899);
            opacity: 0.5;
            box-shadow: 0 0 12px var(--accent-color, #ec4899);
        }

        .cover.audio-pulse {
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
        }

        #widget:not(.playing) .bar {
            animation: none !important;
            transform: scaleY(0.15);
            opacity: 0.3;
        }

        /* === NOW PLAYING INDICATOR === */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(245, 247, 251, 0.55);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .now-playing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-secondary);
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(110, 242, 227, 0.8);
        }

        .source-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            opacity: 0.8;
            margin-left: 4px;
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* === NEXT TRACK === */
        .next-track {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .next-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .next-cover {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
        }

        .next-info {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="widget">
        <div class="card">
            <!-- Animated background -->
            <div class="bg-layer" id="bg-layer"></div>

            <!-- Floating particles -->
            <div class="particles" id="particles"></div>



            <!-- Glass overlay -->
            <div class="glass-overlay"></div>

            <!-- Main content -->
            <div class="content">
                <div class="cover-container">
                    <canvas id="cover-canvas" width="300" height="300"
                        style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180%; height: 180%; z-index: -1; pointer-events: none; opacity: 0.8;"></canvas>
                    <div class="cover-glow" id="cover-glow"></div>
                    <div class="cover" id="cover"></div>
                    <div class="cover-reflection" id="cover-reflection"></div>
                </div>

                <div class="info">
                    <div class="now-playing">
                        <div class="now-playing-dot"></div>
                        <img class="source-icon" id="source-icon" src="" style="display:none;">
                        Now playing
                    </div>
                    <div class="title-container">
                        <div class="title" id="title">Not Playing</div>
                    </div>
                    <div class="artist" id="artist">Artist</div>
                    <div class="progress-section">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress"></div>
                        </div>
                    </div>
                    <!-- Next track -->
                    <div class="next-track" id="next-track" style="display: none;">
                        <span class="next-label">Next:</span>
                        <img class="next-cover" id="next-cover" src="">
                        <span class="next-info" id="next-info"></span>
                    </div>
                </div>

                <div class="visualizer" id="visualizer">
                    <canvas id="viz-canvas" width="180" height="180"></canvas>
                    <div class="visualizer-bars" id="visualizer-bars">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FETCH_URL = 'http://localhost:1608/';
        const REFRESH_RATE = 500;
        const HIDE_DELAY = 3000;
        const PLACEHOLDER_IMG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        // URL Parameters: ?preset=vinyl&opacity=80&sensitivity=1.5&glow=50
        const urlParams = new URLSearchParams(window.location.search);
        const PRESET = urlParams.get('preset') || 'vinyl';
        const THEME = urlParams.get('theme') || 'ember';
        const VIZ = urlParams.get('viz') || 'radial';
        const ACCENT = urlParams.get('accent') || '';
        const OPACITY = parseFloat(urlParams.get('opacity')) || 80;
        const SENSITIVITY = parseFloat(urlParams.get('sensitivity')) || 1.0;
        const GLOW = parseFloat(urlParams.get('glow')) || 50;
        const MOTION = parseFloat(urlParams.get('motion')) || 1.0;
        const manualBpm = urlParams.get('bpm') ? parseInt(urlParams.get('bpm')) : null;
        window.latestBands = [];

        // Apply preset styles - FULL DESIGN CHANGE
        function applyPreset(preset) {
            const widgetEl = document.getElementById('widget');
            const cover = document.getElementById('cover');
            const card = document.querySelector('.card');
            const bgLayer = document.getElementById('bg-layer');
            const content = document.querySelector('.content');
            const title = document.getElementById('title');
            const artist = document.getElementById('artist');
            const reflection = document.querySelector('.cover-reflection');
            const glow = document.querySelector('.cover-glow');
            const particles = document.getElementById('particles');

            // Reset all styles first
            if (cover) {
                cover.style.cssText = '';
                cover.className = 'cover';
            }
            if (card) card.style.cssText = '';
            if (bgLayer) bgLayer.style.opacity = (OPACITY / 100).toFixed(2);
            if (reflection) reflection.style.display = '';
            if (glow) glow.style.display = '';
            if (particles) particles.style.display = '';
            if (content) content.style.cssText = '';
            if (title) title.style.cssText = '';
            if (artist) artist.style.cssText = '';
            if (widgetEl) widgetEl.dataset.preset = preset;

            switch (preset) {
                case 'vinyl':
                    // Classic spinning vinyl record
                    document.documentElement.style.setProperty('--cover-size', '160px');
                    if (cover) {
                        cover.style.borderRadius = '50%';
                        cover.style.boxShadow = '0 8px 25px rgba(0,0,0,0.4), inset 0 0 0 40px rgba(0,0,0,0.3), inset 0 0 0 42px rgba(255,255,255,0.1)';
                    }
                    if (reflection) reflection.style.borderRadius = '50%';
                    break;

                case 'pill':
                    // Spotify/Apple Music style - modern, no rotation
                    document.documentElement.style.setProperty('--cover-size', '120px');
                    if (cover) {
                        cover.style.borderRadius = '16px';
                        cover.style.animation = 'none';
                        cover.style.boxShadow = '0 10px 30px rgba(0,0,0,0.4)';
                    }
                    if (reflection) reflection.style.display = 'none';
                    if (card) {
                        card.style.borderRadius = '20px';
                        card.style.padding = '20px';
                    }
                    break;

                case 'glass':
                    // iOS Glassmorphism - frosted translucent
                    document.documentElement.style.setProperty('--cover-size', '140px');
                    if (cover) {
                        cover.style.borderRadius = '50%';
                        cover.style.border = '2px solid rgba(255,255,255,0.3)';
                        cover.style.boxShadow = '0 0 40px rgba(255,255,255,0.2)';
                    }
                    if (card) {
                        card.style.background = 'rgba(255,255,255,0.08)';
                        card.style.backdropFilter = 'blur(30px)';
                        card.style.border = '1px solid rgba(255,255,255,0.15)';
                    }
                    if (bgLayer) bgLayer.style.filter = 'blur(80px) saturate(1.5)';
                    if (particles) particles.style.display = 'none';
                    break;

                case 'minimal':
                    // Clean minimal - just text, no cover
                    if (cover) cover.style.display = 'none';
                    if (glow) glow.style.display = 'none';
                    if (reflection) reflection.style.display = 'none';
                    if (particles) particles.style.display = 'none';
                    if (content) {
                        content.style.justifyContent = 'center';
                        content.style.textAlign = 'center';
                    }
                    if (title) {
                        title.style.fontSize = '32px';
                        title.style.textAlign = 'center';
                    }
                    if (artist) {
                        artist.style.textAlign = 'center';
                        artist.style.fontSize = '18px';
                    }
                    if (card) {
                        card.style.background = 'rgba(0,0,0,0.5)';
                        card.style.backdropFilter = 'blur(20px)';
                    }
                    break;

                case 'stack':
                    document.documentElement.style.setProperty('--cover-size', '180px');
                    if (content) {
                        content.style.flexDirection = 'column';
                        content.style.alignItems = 'flex-start';
                    }
                    if (cover) {
                        cover.style.borderRadius = '18px';
                        cover.style.boxShadow = '0 12px 30px rgba(0,0,0,0.5)';
                    }
                    break;

                case 'poster':
                    document.documentElement.style.setProperty('--cover-size', '190px');
                    if (cover) {
                        cover.style.borderRadius = '14px';
                        cover.style.boxShadow = '0 16px 40px rgba(0,0,0,0.55)';

        const vizState = {
            bands: new Array(64).fill(0),
            smooth: new Array(64).fill(0),
            grid: []

        function resizeVizCanvas() {
            if (!vizCanvas || !vizCtx) return;
            const rect = vizCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            vizCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
            vizCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
            vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildHexGrid(rect.width, rect.height);
        }

        function buildHexGrid(width, height) {
            const size = 14;
            const hexHeight = size * 2;
            const hexWidth = Math.sqrt(3) * size;
            const rows = Math.ceil(height / (hexHeight * 0.75));
            const cols = Math.ceil(width / hexWidth) + 1;
            const grid = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * hexWidth + ((r % 2) ? hexWidth / 2 : 0);
                    const y = r * (hexHeight * 0.75);
                    if (x > width + hexWidth || y > height + hexHeight) continue;
                    grid.push({ x, y });
                }
            }
            vizState.grid = grid;
        }

        function hexToRgba(hex, alpha) {
            let value = hex.trim();
            if (value.startsWith('rgba')) return value;
            if (value.startsWith('rgb')) return value.replace('rgb', 'rgba').replace(')', `, ${alpha})`);
            if (value.startsWith('#')) value = value.slice(1);
            if (value.length === 3) {
                value = value[0] + value[0] + value[1] + value[1] + value[2] + value[2];
            }
            const r = parseInt(value.slice(0, 2), 16);
            const g = parseInt(value.slice(2, 4), 16);
            const b = parseInt(value.slice(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function clamp01(value) {
            return Math.max(0, Math.min(1, value));
        }

        function normalizeBands(bands) {
            if (!bands || !bands.length) return vizState.bands;
            const target = bands.slice(0, 64);
            const smoothFactor = 0.12 * Math.max(0.5, Math.min(2.0, MOTION));
            for (let i = 0; i < 64; i++) {
                const value = clamp01((target[i] || 0) * SENSITIVITY);
                vizState.smooth[i] += (value - vizState.smooth[i]) * smoothFactor;
                vizState.bands[i] = vizState.smooth[i];
            }
            return vizState.bands;
        }

        function updateBars(bands) {
            if (!vizBars.length) return;
            const step = Math.max(1, Math.floor(bands.length / vizBars.length));
            vizBars.forEach((bar, idx) => {
                const bandIndex = Math.min(bands.length - 1, idx * step);
                const level = clamp01(bands[bandIndex] || 0);
                bar.style.height = `${12 + level * 88}%`;
                bar.style.opacity = (0.4 + level * 0.6).toFixed(2);
            });
        }

        function drawRadial(ctx, width, height, bands) {
            const cx = width / 2;
            const cy = height / 2;
            const baseRadius = Math.min(width, height) * 0.25;
            const count = bands.length;
            const step = (Math.PI * 2) / count;
            const lineColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color') || '#f8b84e';

            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = hexToRgba(lineColor, 0.9);
            ctx.lineWidth = 3;

            for (let i = 0; i < count; i++) {
                const amp = bands[i];
                const angle = i * step;
                const outer = baseRadius + amp * (Math.min(width, height) * 0.22);
                const x1 = Math.cos(angle) * baseRadius;
                const y1 = Math.sin(angle) * baseRadius;
                const x2 = Math.cos(angle) * outer;
                const y2 = Math.sin(angle) * outer;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawWave(ctx, width, height, bands) {
            const color = getComputedStyle(document.documentElement).getPropertyValue('--accent-secondary') || '#6ef2e3';
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            bands.forEach((amp, idx) => {
                const x = (idx / (bands.length - 1)) * width;
                const y = height / 2 + (amp - 0.5) * height * 0.6;
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = hexToRgba(color, 0.9);
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawTiles(ctx, width, height, bands) {
            const cols = 8;
            const rows = 4;
            const cellW = width / cols;
            const cellH = height / rows;
            const color = getComputedStyle(document.documentElement).getPropertyValue('--accent-color') || '#f8b84e';
            ctx.clearRect(0, 0, width, height);

            let bandIndex = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const amp = bands[bandIndex % bands.length];
                    const pad = 6;
                    const h = cellH * (0.25 + amp * 0.75);
                    ctx.fillStyle = hexToRgba(color, 0.15 + amp * 0.7);
                    ctx.fillRect(c * cellW + pad, r * cellH + (cellH - h) + pad, cellW - pad * 2, h - pad);
                    bandIndex++;
                }
            }
        }

        function drawHex(ctx, width, height, bands) {
            const color = getComputedStyle(document.documentElement).getPropertyValue('--accent-secondary') || '#6ef2e3';
            ctx.clearRect(0, 0, width, height);
            const grid = vizState.grid.length ? vizState.grid : [];
            const size = 12;
            const step = Math.max(1, Math.floor(bands.length / grid.length));
            let idx = 0;

            for (const cell of grid) {
                const amp = bands[(idx * step) % bands.length];
                const alpha = 0.1 + amp * 0.9;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = Math.PI / 3 * i + Math.PI / 6;
                    const x = cell.x + Math.cos(angle) * size;
                    const y = cell.y + Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fillStyle = hexToRgba(color, alpha);
                ctx.fill();
                idx++;
            }
        }

        function renderVisualizer() {

            } else if (VIZ === 'tiles') {

            } else if (VIZ === 'ring') {

        function adjustAnimationsToBPM(bpm) {
            // Convert BPM to animation duration: faster BPM = faster animations

            const bars = document.querySelectorAll('.bar');

        // Extract dominant colors from album cover (Improved Algorithm)
        function extractColorsFromCover(coverUrl) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 50;
                canvas.height = 50;
                ctx.drawImage(img, 0, 0, 50, 50);

                try {
                    const imageData = ctx.getImageData(0, 0, 50, 50).data;
                    const colors = [];

                    // Sample pixels from different regions
                    const regions = [
                        { x: 25, y: 25 }, { x: 10, y: 10 }, { x: 40, y: 10 }, { x: 10, y: 40 }, { x: 40, y: 40 },
                        { x: 25, y: 5 }, { x: 5, y: 25 }, { x: 45, y: 25 }, { x: 25, y: 45 }
                    ];

                    regions.forEach(({ x, y }) => {
                        const idx = (y * 50 + x) * 4;
                        const r = imageData[idx];
                        const g = imageData[idx + 1];
                        const b = imageData[idx + 2];
                        const brightness = (r + g + b) / 3;
                        // Avoid too dark or too bright
                        if (brightness > 60 && brightness < 240) {
                            colors.push({ r, g, b, brightness });
                        }
                    });

                    if (colors.length > 0) {
                        // Sort by brightness or saturation to find "vibrant" color
                        // Simple brightness sort for now
                        colors.sort((a, b) => b.brightness - a.brightness);

                        // Pick the brightest non-white color

                        const rgb = `rgb(${c.r}, ${c.g}, ${c.b})`;

                        // Set CSS Variable for rings

                        }
                    }
                } catch (e) {
                    console.log('[Color] CORS execution failed, using defaults');
                }
            };
            img.src = coverUrl;
        }

                            else if (hex.length === 6) { r = parseInt(hex.slice(0, 2), 16); g = parseInt(hex.slice(2, 4), 16); b = parseInt(hex.slice(4, 6), 16); }

        function updateCoverVisualization(bands) {
            let bass, mid, high;

                bass = Math.max(...bands.slice(0, 4));
                mid = bands.slice(4, 16).reduce((a, b) => a + b, 0) / 12;
                high = bands.slice(16, 32).reduce((a, b) => a + b, 0) / 16;
            } else {
                [bass, mid, high] = bands;
            }

            // Pulse cover on bass
            // Pulse cover on bass
            if (audioCover) {
                const c = window.coverColor || '#ec4899';
                // Convert hex/rgb to just rgb values for rgba construction if needed, 
                // but here we can just rely on css variable or simple opacity hack if it was rgba
                // Let's use the --accent-color variable logic
                const scale = 1 + (bass * 0.1);
                const glow = bass * 40;

                audioCover.style.transform = `scale(${scale})`;

        // === COVER VISUALIZER LOGIC ===
        let allBands = new Array(128).fill(0); // Global for resetVisualization
        let vBass = 0;

        (function () {

                        if (rgb) return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
                    }
                    if (hex.startsWith('#')) hex = hex.slice(1);
                    if (hex.length === 3) {
                        r = parseInt(hex[0] + hex[0], 16);
                        g = parseInt(hex[1] + hex[1], 16);
                        b = parseInt(hex[2] + hex[2], 16);
                    } else if (hex.length === 6) {
                        r = parseInt(hex.substring(0, 2), 16);
                        g = parseInt(hex.substring(2, 4), 16);
                        b = parseInt(hex.substring(4, 6), 16);
                    }
                    return `rgba(${r},${g},${b},${alpha})`;
                };

                // Update Glow Element Color
                const glowEl = document.getElementById('cover-glow');
                if (glowEl) {
                    glowEl.style.boxShadow = `0 0 60px ${baseColor}`;
                    glowEl.style.backgroundColor = baseColor;
                }

                // FULL OPACITY (1.0)
                const colorLines = hex2rgba(baseColor, 1.0);

                // Process bands
                let bass = 0, mid = 0, high = 0;
                if (allBands.length === 128) {
                    bass = Math.max(...allBands.slice(0, 16));
                    mid = allBands.slice(16, 64).reduce((a, b) => a + b, 0) / 48;
                    high = allBands.slice(64, 128).reduce((a, b) => a + b, 0) / 64;
                } else if (allBands.length >= 32) {
                    bass = Math.max(...allBands.slice(0, 4));
                    mid = allBands.slice(4, 16).reduce((a, b) => a + b, 0) / 12;
                    high = allBands.slice(16, 32).reduce((a, b) => a + b, 0) / 16;
                } else if (allBands.length === 3) {
                    [bass, mid, high] = allBands;
                }

                vBass += (bass - vBass) * 0.2;
                vMid += (mid - vMid) * 0.2;
                vHigh += (high - vHigh) * 0.2;

                // 1. Spectrum Ring
                const radius = 80 + vHigh * 20;
                const bandCount = allBands.length; // 128 or 64 or 32
                const totalPoints = bandCount * 2; // Mirror

                // Pre-calculate points
                const points = [];
                for (let i = 0; i < totalPoints; i++) {
                    let bandIdx = i % bandCount;
                    if (i >= bandCount) bandIdx = (bandCount - 1) - (i - bandCount);
                    if (bandIdx < 0) bandIdx = 0;
                    if (bandIdx >= bandCount) bandIdx = bandCount - 1;
                    const val = allBands[bandIdx] || 0;
                    const angle = (i / totalPoints) * Math.PI * 2 - Math.PI / 2;
                    const r = radius + val * 60 * SENSITIVITY;
                    points.push({
                        x: cx + Math.cos(angle) * r,
                        y: cy + Math.sin(angle) * r
                    });
                }

                // Draw smooth curve
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 0; i < points.length; i++) {
                    const p0 = points[i];
                    const p1 = points[(i + 1) % points.length];
                    const midX = (p0.x + p1.x) / 2;
                    const midY = (p0.y + p1.y) / 2;
                    ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
                }
                ctx.closePath();
                ctx.strokeStyle = colorLines;
                ctx.lineWidth = 3;
                ctx.shadowColor = baseColor;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 2. Mid Ring
                ctx.beginPath();
                ctx.arc(cx, cy, 60 + vMid * 25, 0, Math.PI * 2);
                ctx.strokeStyle = colorLines;
                ctx.lineWidth = 2;
                ctx.stroke();

                // 3. Bass Ring
                ctx.beginPath();
                ctx.arc(cx, cy, 50 + vBass * 15, 0, Math.PI * 2);
                ctx.strokeStyle = colorLines;
                ctx.lineWidth = 4;
                ctx.shadowColor = baseColor;
                ctx.shadowBlur = 20 * vBass;
                ctx.stroke();
                ctx.shadowBlur = 0;

                requestAnimationFrame(draw);
            }
            draw();
        })();

        function resetVisualization() {
            if (audioCover) {
                audioCover.style.transform = '';
                audioCover.style.boxShadow = '';
            }
            if (bassRing) bassRing.style.opacity = 0;
            if (midRing) midRing.style.opacity = 0;
            if (highRing) highRing.style.opacity = 0;

            // Reset visualizer values
            allBands.fill(0);
            vBass = vMid = vHigh = 0;
            window.latestBands = [];
        }

        connectAudioVisualizer();
    </script>
</body>
